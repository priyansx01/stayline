[package]
name = "stayline-tray"
description = "stayline tray app: status icon, login and settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stayline-ipc.workspace = true
stayline-config.workspace = true
anyhow.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio = { workspace = true, features = ["rt"] }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
tauri-winrt-notification.workspace = true
# Software renderer only: no GPU stack keeps memory use low.
slint = { workspace = true, default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
slint-build.workspace = true
embed-resource.workspace = true
