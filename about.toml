# cargo-about: collects the licences of every crate shipped in stayline.
# Regenerate the notices with scripts\gen-notices.ps1 after changing dependencies.

targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# stayline's own crates (publish = false) are not third-party components.
private = { ignore = true }

# Licences stayline may ship under. Where a crate offers a choice, the
# first acceptable one is used. Slint is used under its royalty-free
# licence, which requires the "Made with Slint" attribution on the About page.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "LicenseRef-Slint-Royalty-free-2.0",
]
